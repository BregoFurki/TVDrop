<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e1410">
    <title>TVDrop</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0e1410;
            --surface: #1b251d;
            --surface-high: #263428;
            --line: #354438;
            --text: #f5f5e8;
            --muted: #b3c0ad;
            --soft: #829383;
            --lime: #d8fb86;
            --mint: #9ae2b2;
            --danger: #f4a498;
            --amber: #f6cc85;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 8% 12%, #203528 0, transparent 30%),
                        radial-gradient(circle at 92% 88%, #1b2b21 0, transparent 33%), var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        button { font: inherit; }
        button:focus-visible {
            outline: 3px solid var(--lime);
            outline-offset: 4px;
        }
        [hidden] { display: none !important; }

        .shell {
            width: min(1180px, calc(100% - 48px));
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            border-bottom: 1px solid var(--line);
        }
        .brand { display: inline-flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid #a6d46f;
            border-radius: 12px;
            background: var(--lime);
            color: var(--bg);
        }
        .brand-mark svg { width: 24px; height: 24px; }
        .brand-name { font-size: 20px; font-weight: 750; letter-spacing: .13em; }
        .language-select {
            max-width: 145px;
            min-height: 40px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .language-select:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
        .fact-label {
            font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        main {
            width: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, .62fr) minmax(0, 1.38fr);
            align-items: center;
            gap: clamp(36px, 7vw, 110px);
            padding: 50px 0 70px;
        }
        .intro { max-width: 480px; }
        h1 {
            margin: 0;
            font-size: clamp(58px, 6vw, 88px);
            line-height: .99;
            font-weight: 300;
            letter-spacing: -.065em;
        }
        h1 span:last-child { color: var(--lime); font-weight: 650; }

        .panel {
            overflow: hidden;
            border: 1px solid #455846;
            border-radius: 28px;
            background: linear-gradient(155deg, #223125, var(--surface) 55%);
            box-shadow: 0 28px 80px #00000044, inset 0 1px 0 #ffffff0b;
        }
        .panel-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 29px 30px 24px;
            border-bottom: 1px solid var(--line);
        }
        .panel-head h2 { margin: 0; font-size: 27px; font-weight: 550; letter-spacing: -.035em; }
        .panel-body { padding: 28px 30px 30px; }
        .connection {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 36px;
            margin-bottom: 20px;
            padding: 7px 12px;
            border: 1px solid #456347;
            border-radius: 999px;
            background: #1b3221;
            color: var(--mint);
            font-size: 12px;
            font-weight: 650;
        }
        .connection::before {
            content: "";
            width: 7px;
            height: 7px;
            flex: none;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 4px #9ae2b21c;
        }
        .connection.warn { color: var(--amber); border-color: #776448; background: #342d20; }
        .connection.error { color: var(--danger); border-color: #765048; background: #352723; }

        .dropzone {
            min-height: 286px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 26px 22px;
            border: 1.5px dashed #708d6c;
            border-radius: 20px;
            background: #152018;
            text-align: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .dropzone.dragover {
            border-color: var(--lime);
            background: #1f3022;
        }
        .dropzone.dragover { transform: translateY(-3px); }
        .dropzone.is-busy { cursor: wait; opacity: .72; }
        .upload-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin-bottom: 17px;
            border: 1px solid #4c664b;
            border-radius: 20px;
            background: #253729;
            color: var(--lime);
        }
        .upload-icon svg { width: 33px; height: 33px; }
        .dropzone h3 { margin: 0; font-size: 21px; font-weight: 550; letter-spacing: -.03em; }
        .dropzone h3 { margin-bottom: 20px; }
        .choose {
            min-height: 46px;
            padding: 0 23px;
            border: 0;
            border-radius: 12px;
            background: var(--lime);
            color: #182016;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            transition: transform .2s, background .2s;
        }
        .choose:hover { background: #ebffaf; transform: translateY(-2px); }
        .choose:disabled { cursor: wait; transform: none; opacity: .7; }
        .file-input { display: none; }
        .file-facts { display: grid; gap: 12px; margin: 18px 0 0; }
        .file-fact { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: baseline; }
        .fact-label { color: var(--soft); }
        .file-fact dd { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

        .progress-card {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #142017;
        }
        .progress-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .progress-top strong {
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .progress-top span { flex: none; color: var(--lime); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
        .progress-track { height: 8px; overflow: hidden; margin: 14px 0 10px; border-radius: 99px; background: #354338; }
        .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--lime); transition: width .18s; }
        .progress-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
        .progress-meta span:last-child { text-align: right; }
        .upload-feedback { margin: 12px 0 0; color: var(--mint); font-size: 13px; line-height: 1.4; }
        .upload-feedback.error { color: var(--danger); }
        .upload-feedback.warn { color: var(--amber); }

        .footer {
            display: flex;
            gap: 16px;
            padding: 22px 0 28px;
            border-top: 1px solid var(--line);
            color: var(--soft);
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 850px) {
            .shell { width: min(620px, calc(100% - 36px)); }
            .topbar { min-height: 74px; }
            main { grid-template-columns: 1fr; gap: 32px; padding: 42px 0 45px; }
            .intro { max-width: 100%; }
            h1 { font-size: clamp(52px, 11vw, 76px); }
        }
        @media (max-width: 520px) {
            .shell { width: calc(100% - 28px); }
            main { padding-top: 22px; }
            .intro { display: none; }
            .panel { border-radius: 22px; }
            .panel-head { padding: 23px 21px 20px; }
            .panel-head h2 { font-size: 23px; }
            .panel-body { padding: 20px; }
            .dropzone { min-height: 194px; }
            .dropzone h3 { display: none; }
            .file-fact { grid-template-columns: 1fr; gap: 3px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand" aria-label="TVDrop">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M12 8v6m0-6-2.5 2.5M12 8l2.5 2.5M9 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="brand-name">TVDROP</span>
            </div>
            <select class="language-select" id="languageSelect" aria-label="Language">
                <option value="auto">Auto</option>
                <option value="en">English</option>
                <option value="tr">Türkçe</option>
                <option value="pt-BR">Português (Brasil)</option>
                <option value="zh-CN">简体中文</option>
                <option value="ja">日本語</option>
                <option value="de">Deutsch</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </header>

        <main>
            <section class="intro" aria-labelledby="heroTitle">
                <h1 id="heroTitle"><span data-i18n="hero1"></span><br><span data-i18n="hero2"></span><br><span data-i18n="hero3"></span></h1>
            </section>

            <section class="panel" aria-labelledby="uploadTitle">
                <div class="panel-head">
                    <h2 id="uploadTitle" data-i18n="uploadTitle"></h2>
                </div>
                <div class="panel-body">
                    <div class="connection warn" id="connectionStatus" role="status" aria-live="polite"></div>
                    <div class="dropzone" id="dropzone" data-i18n-aria="uploadArea">
                        <input type="file" id="fileInput" class="file-input" multiple>
                        <div class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 36 36" fill="none"><path d="M18 25V7m0 0-7 7m7-7 7 7M8 27v2h20v-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <h3 data-i18n="dropFiles"></h3>
                        <button class="choose" id="chooseButton" type="button" data-i18n="chooseFiles"></button>
                    </div>
                    <dl class="file-facts">
                        <div class="file-fact"><dt class="fact-label" data-i18n="typesLabel"></dt><dd data-i18n="typesBody"></dd></div>
                        <div class="file-fact"><dt class="fact-label" data-i18n="limitLabel"></dt><dd data-i18n="limitBody"></dd></div>
                    </dl>
                    <div class="progress-card" id="progressCard" hidden aria-live="polite">
                        <div class="progress-top"><strong id="filenameText"></strong><span id="percentText">0%</span></div>
                        <div class="progress-track" role="progressbar" id="progressTrack" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="transferProgress"><div class="progress-fill" id="progressBarFill"></div></div>
                        <div class="progress-meta"><span id="speedText"></span><span id="sizeText">0 B / 0 B</span></div>
                    </div>
                    <p class="upload-feedback" id="uploadFeedback" role="status" aria-live="polite" hidden></p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span data-i18n="footer"></span>
        </footer>
    </div>

    <script src="/i18n.js"></script>
    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const chooseButton = document.getElementById('chooseButton');
        const progressCard = document.getElementById('progressCard');
        const filenameText = document.getElementById('filenameText');
        const percentText = document.getElementById('percentText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressTrack = document.getElementById('progressTrack');
        const speedText = document.getElementById('speedText');
        const sizeText = document.getElementById('sizeText');
        const connectionStatus = document.getElementById('connectionStatus');
        const uploadFeedback = document.getElementById('uploadFeedback');
        const languageSelect = document.getElementById('languageSelect');
        const maxFileBytes = 2 * 1000 * 1000 * 1000;
        let isUploading = false;
        let connectionKey = 'checking';
        let feedbackKey = '';
        let feedbackArgs = [];
        let speedKey = 'preparing';
        const supportedLanguages = Object.keys(window.TVDropI18n);
        function matchLanguage(tag) {
            const lower = tag.toLowerCase();
            if (lower.startsWith('pt')) return 'pt-BR';
            if (lower.startsWith('zh')) return 'zh-CN';
            return supportedLanguages.find(code => code === lower.split('-')[0]) || null;
        }
        function preferredLanguage() {
            for (const tag of navigator.languages || [navigator.language || 'en']) {
                const match = matchLanguage(tag);
                if (match) return match;
            }
            return 'en';
        }
        let languageChoice;
        try { languageChoice = localStorage.getItem('tvdrop.language') || 'auto'; }
        catch (_) { languageChoice = 'auto'; }
        if (languageChoice !== 'auto' && !supportedLanguages.includes(languageChoice)) languageChoice = 'auto';
        let activeLanguage = languageChoice === 'auto' ? preferredLanguage() : languageChoice;
        function t(key, ...args) {
            const value = window.TVDropI18n[activeLanguage][key] || window.TVDropI18n.en[key] || key;
            return value.replace(/\{(\d+)\}/g, (_, index) => args[Number(index)] ?? '');
        }
        function applyLanguage() {
            document.documentElement.lang = activeLanguage;
            document.title = t('pageTitle');
            languageSelect.value = languageChoice;
            languageSelect.setAttribute('aria-label', t('languageLabel'));
            languageSelect.options[0].textContent = t('autoLanguage');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            if (connectionKey) connectionStatus.textContent = t(connectionKey);
            if (feedbackKey) uploadFeedback.textContent = t(feedbackKey, ...feedbackArgs);
            if (!isUploading) speedText.textContent = t(speedKey);
            if (!isUploading && progressCard.hidden) filenameText.textContent = t('file');
        }
        languageSelect.addEventListener('change', () => {
            languageChoice = languageSelect.value;
            try { localStorage.setItem('tvdrop.language', languageChoice); } catch (_) { /* Storage may be disabled. */ }
            activeLanguage = languageChoice === 'auto' ? preferredLanguage() : languageChoice;
            applyLanguage();
        });
        window.addEventListener('languagechange', () => {
            if (languageChoice === 'auto') { activeLanguage = preferredLanguage(); applyLanguage(); }
        });

        function currentUploadToken() {
            return new URLSearchParams(location.hash.slice(1)).get('token') || '';
        }

        function setConnection(message, kind = '') {
            connectionKey = '';
            connectionStatus.textContent = message;
            connectionStatus.className = 'connection' + (kind ? ' ' + kind : '');
        }

        function setConnectionKey(key, kind = '') {
            setConnection(t(key), kind);
            connectionKey = key;
        }

        function setFeedback(message, kind = '') {
            feedbackKey = '';
            feedbackArgs = [];
            uploadFeedback.textContent = message;
            uploadFeedback.className = 'upload-feedback' + (kind ? ' ' + kind : '');
            uploadFeedback.hidden = !message;
        }

        function setFeedbackKey(key, kind = '', ...args) {
            setFeedback(t(key, ...args), kind);
            feedbackKey = key;
            feedbackArgs = args;
        }

        function setBusy(busy) {
            isUploading = busy;
            fileInput.disabled = busy;
            chooseButton.disabled = busy;
            dropzone.classList.toggle('is-busy', busy);
            dropzone.setAttribute('aria-busy', String(busy));
        }

        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return (bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 1) + ' ' + units[index];
        }

        function openPicker() {
            if (isUploading) {
                setFeedbackKey('busy', 'warn');
                return;
            }
            fileInput.click();
        }

        chooseButton.addEventListener('click', openPicker);
        ['dragenter', 'dragover'].forEach(name => dropzone.addEventListener(name, event => {
            event.preventDefault();
            if (!isUploading) dropzone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(name => dropzone.addEventListener(name, event => {
            event.preventDefault();
            dropzone.classList.remove('dragover');
        }));
        dropzone.addEventListener('drop', event => handleUpload(event.dataTransfer.files));
        fileInput.addEventListener('change', () => handleUpload(fileInput.files));

        async function handleUpload(files) {
            if (!files || !files.length) return;
            if (isUploading) {
                setFeedbackKey('busy', 'warn');
                return;
            }
            const selected = Array.from(files);
            const oversized = selected.find(file => file.size > maxFileBytes);
            if (oversized) {
                setFeedbackKey('oversized', 'error', oversized.name);
                fileInput.value = '';
                return;
            }
            const uploadToken = currentUploadToken();
            if (!uploadToken) {
                setConnectionKey('pairRequired', 'warn');
                setFeedbackKey('scanToSend', 'warn');
                return;
            }

            setBusy(true);
            setFeedback('');
            let completed = 0;
            try {
                for (const [index, file] of selected.entries()) {
                    await uploadSingleFile(file, index + 1, selected.length, uploadToken);
                    completed++;
                }
                setFeedbackKey(completed === 1 ? 'oneComplete' : 'manyComplete', '', completed);
                setConnectionKey('connected');
            } catch (error) {
                setFeedback(error.message || t('transferFailed'), 'error');
            } finally {
                fileInput.value = '';
                setBusy(false);
            }
        }

        function uploadSingleFile(file, number, total, uploadToken) {
            return new Promise((resolve, reject) => {
                progressCard.hidden = false;
                filenameText.textContent = total > 1 ? `${number}/${total} · ${file.name}` : file.name;
                percentText.textContent = '0%';
                progressBarFill.style.width = '0%';
                progressTrack.setAttribute('aria-valuenow', '0');
                speedText.textContent = t('preparing');
                speedKey = 'preparing';
                sizeText.textContent = `0 B / ${formatBytes(file.size)}`;

                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('file', file);
                let sampledAt = Date.now();
                let sampledBytes = 0;

                xhr.upload.onprogress = event => {
                    if (!event.lengthComputable) return;
                    const percent = Math.min(100, Math.round(event.loaded / event.total * 100));
                    percentText.textContent = percent + '%';
                    progressBarFill.style.width = percent + '%';
                    progressTrack.setAttribute('aria-valuenow', String(percent));
                    sizeText.textContent = `${formatBytes(event.loaded)} / ${formatBytes(event.total)}`;
                    const now = Date.now();
                    const elapsed = (now - sampledAt) / 1000;
                    if (elapsed >= .5) {
                        speedText.textContent = formatBytes((event.loaded - sampledBytes) / elapsed) + '/s';
                        sampledAt = now;
                        sampledBytes = event.loaded;
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        percentText.textContent = '100%';
                        progressBarFill.style.width = '100%';
                        progressTrack.setAttribute('aria-valuenow', '100');
                        speedText.textContent = t('sentToTv');
                        speedKey = 'sentToTv';
                        sizeText.textContent = formatBytes(file.size);
                        resolve();
                        return;
                    }
                    const message = xhr.status === 401
                        ? t('pairExpired')
                        : xhr.status === 413
                            ? t('tooLargeOrSpace')
                            : xhr.status === 429 ? t('anotherTransfer') : t('transferFailed');
                    if (xhr.status === 401) setConnectionKey('pairAgain', 'warn');
                    speedText.textContent = t('stopped');
                    speedKey = 'stopped';
                    reject(new Error(message));
                };
                xhr.onerror = () => {
                    setConnectionKey('disconnected', 'error');
                    speedText.textContent = t('connectionLost');
                    speedKey = 'connectionLost';
                    reject(new Error(t('connectionRetry')));
                };
                xhr.open('POST', '/upload?filename=' + encodeURIComponent(file.name), true);
                xhr.setRequestHeader('X-TVDrop-Token', uploadToken);
                xhr.send(formData);
            });
        }

        function checkConnection() {
            if (!currentUploadToken()) {
                setConnectionKey('pairRequired', 'warn');
                return;
            }
            fetch('/api/status', { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error(t('tvNoResponse'));
                    setConnectionKey('connected');
                })
                .catch(() => setConnectionKey('disconnected', 'error'));
        }
        window.addEventListener('hashchange', () => {
            setFeedback('');
            checkConnection();
        });
        applyLanguage();
        checkConnection();
    </script>
</body>
</html>
